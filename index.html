<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hacky Duck</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #1b2433;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Trebuchet MS", Arial, sans-serif;
  }
  canvas {
    display: block;
    max-width: 100vw;
    max-height: 100vh;
    border-radius: 8px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
  }
</style>
</head>
<body>
<canvas id="game" width="800" height="500"></canvas>
<script>
(() => {
  "use strict";

  // ---------- Setup ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width;
  const H = canvas.height;
  const GROUND_Y = 440;
  const GRAVITY = 900;            // px/s^2
  const DUCK_SPEED = 380;         // px/s
  const SACK_R = 11;
  const KICK_DURATION = 0.22;     // seconds the leg is up
  const KICK_COOLDOWN = 0.12;     // extra delay before another kick
  const MIN_APEX = 140;           // min height of an arc above the kick point
  const MAX_APEX = 300;           // max height of an arc above the kick point
  const STORAGE_KEY = "hackyDuckHighScores";
  const MAX_SCORES = 10;

  // ---------- High scores ----------
  function loadScores() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      const list = raw ? JSON.parse(raw) : [];
      return Array.isArray(list) ? list.slice(0, MAX_SCORES) : [];
    } catch (e) {
      return [];
    }
  }
  function saveScores(list) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); } catch (e) { /* ignore */ }
  }
  let highScores = loadScores();

  function qualifies(score) {
    if (score <= 0) return false;
    if (highScores.length < MAX_SCORES) return true;
    return score > highScores[highScores.length - 1].score;
  }
  function insertScore(initials, score) {
    const entry = { initials, score };
    highScores.push(entry);
    highScores.sort((a, b) => b.score - a.score);
    highScores = highScores.slice(0, MAX_SCORES);
    saveScores(highScores);
    return highScores.indexOf(entry);
  }

  // ---------- Sound ----------
  let audioCtx = null;
  function beep(freq, dur, type = "square", vol = 0.08, slideTo = null) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const t = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t);
      if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
      gain.gain.setValueAtTime(vol, t);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + dur);
    } catch (e) { /* audio unavailable */ }
  }
  const sfx = {
    kick: () => beep(520, 0.09, "square", 0.07, 780),
    whiff: () => beep(220, 0.06, "triangle", 0.04),
    lose: () => { beep(330, 0.25, "sawtooth", 0.07, 110); setTimeout(() => beep(160, 0.35, "sawtooth", 0.06, 70), 220); },
    quack: () => { beep(420, 0.08, "sawtooth", 0.05, 300); setTimeout(() => beep(400, 0.1, "sawtooth", 0.05, 260), 100); },
    type: () => beep(880, 0.04, "square", 0.04),
  };

  // ---------- Game state ----------
  // states: "ready" (sack on foot), "playing", "falling" (brief pause after miss),
  //         "initials", "scores"
  let state = "ready";
  let score = 0;
  let kicks = 0;
  let initials = "";
  let lastRank = -1;
  let stateTimer = 0;

  const duck = { x: W / 2, dir: 1, kickT: 0, cooldown: 0, walkPhase: 0, moving: false };
  const sack = { x: 0, y: 0, vx: 0, vy: 0, spin: 0, spinV: 0 };
  const popups = [];   // floating "+100" text
  const dust = [];     // ground puffs
  const keys = { left: false, right: false };

  function hipPos() {
    return { x: duck.x + 8 * duck.dir, y: GROUND_Y - 34 };
  }
  // Position of the kicking foot (the sack sits/contacts here)
  function footPos() {
    const hip = hipPos();
    const k = kickProgress();
    const angle = k * 1.15; // radians the leg swings forward
    const len = 30;
    return {
      x: hip.x + Math.sin(angle) * len * duck.dir + 8 * duck.dir,
      y: hip.y + Math.cos(angle) * len,
    };
  }
  // 0..1..0 swing curve while the kick is active
  function kickProgress() {
    if (duck.kickT <= 0) return 0;
    const t = 1 - duck.kickT / KICK_DURATION;
    return Math.sin(t * Math.PI);
  }

  function resetGame() {
    state = "ready";
    score = 0;
    kicks = 0;
    initials = "";
    lastRank = -1;
    duck.x = W / 2;
    duck.dir = 1;
    duck.kickT = 0;
    duck.cooldown = 0;
    popups.length = 0;
    dust.length = 0;
    placeSackOnFoot();
  }

  function placeSackOnFoot() {
    const f = footPos();
    sack.x = f.x;
    sack.y = f.y - SACK_R - 2;
    sack.vx = 0;
    sack.vy = 0;
  }

  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // Launch the sack on a random parabola. The arc is independent of the
  // angle of contact: we pick a random apex height and a random reachable
  // landing spot, then solve for the velocity that produces that arc.
  function launchSack() {
    const maxApex = Math.min(MAX_APEX, sack.y - 50); // stay on screen
    const apex = rand(MIN_APEX, Math.max(MIN_APEX + 1, maxApex));
    sack.vy = -Math.sqrt(2 * GRAVITY * apex);

    // Time until the sack would reach the ground from here
    const drop = GROUND_Y - SACK_R - sack.y;
    const tGround = (-sack.vy + Math.sqrt(sack.vy * sack.vy + 2 * GRAVITY * drop)) / GRAVITY;

    // The duck must be able to get there in time (with margin) -> horizontal reach
    const reach = DUCK_SPEED * tGround * 0.7;
    const minX = 50, maxX = W - 50;
    let target;
    // Make it interesting: usually require some movement
    for (let i = 0; i < 8; i++) {
      target = sack.x + rand(-reach, reach);
      if (target >= minX && target <= maxX && Math.abs(target - sack.x) > 40) break;
    }
    target = clamp(target, minX, maxX);
    sack.vx = (target - sack.x) / tGround;
    sack.spinV = rand(-14, 14);
  }

  function kick() {
    if (duck.kickT > 0 || duck.cooldown > 0) return;
    duck.kickT = KICK_DURATION;
    duck.cooldown = KICK_DURATION + KICK_COOLDOWN;
    if (state === "ready") {
      state = "playing";
      // sack leaves the foot
      launchSack();
      sfx.kick();
      return;
    }
    // Check right away too, in case the sack is already in the zone
    if (!tryContact()) sfx.whiff();
  }

  // The sack is kickable only when it's right at the duck's feet, just
  // before it lands. Passing the head, back or body never counts.
  const FOOT_REACH_X = 26;   // horizontal tolerance around the feet
  const FOOT_REACH_Y = 55;   // how far above the ground the foot can reach
  function inKickZone() {
    const hip = hipPos();
    const feetCenter = hip.x + 4 * duck.dir; // between the two feet, toward the toes
    const dx = Math.abs(sack.x - feetCenter);
    return dx < FOOT_REACH_X && sack.y + SACK_R > GROUND_Y - FOOT_REACH_Y;
  }

  let contactThisKick = false;
  function tryContact() {
    if (state !== "playing" || duck.kickT <= 0 || contactThisKick) return false;
    if (sack.vy < -50) return false; // already rising from a previous kick
    if (!inKickZone()) return false;
    contactThisKick = true;
    kicks++;
    score += 100;
    launchSack();
    sfx.kick();
    popups.push({ x: sack.x, y: sack.y - 20, t: 0.9, text: "+100" });
    return true;
  }

  function gameOver() {
    state = "falling";
    stateTimer = 1.1;
    sfx.lose();
    for (let i = 0; i < 12; i++) {
      dust.push({ x: sack.x, y: GROUND_Y, vx: rand(-90, 90), vy: rand(-120, -30), t: rand(0.4, 0.8) });
    }
  }

  function finishFall() {
    if (qualifies(score)) {
      state = "initials";
      initials = "";
      sfx.quack();
    } else {
      state = "scores";
      lastRank = -1;
    }
  }

  // ---------- Input ----------
  window.addEventListener("keydown", (e) => {
    const k = e.key;
    if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", " "].includes(k)) e.preventDefault();

    if (state === "initials") {
      if (/^[a-zA-Z]$/.test(k) && initials.length < 3) {
        initials += k.toUpperCase();
        sfx.type();
      } else if (k === "Backspace") {
        initials = initials.slice(0, -1);
      } else if (k === "Enter" && initials.length > 0) {
        lastRank = insertScore(initials.padEnd(3, " ").trim() || "???", score);
        state = "scores";
        stateTimer = 0.4;
        sfx.quack();
      }
      return;
    }

    if (state === "scores") {
      if ((k === " " || k === "Enter") && stateTimer <= 0) resetGame();
      return;
    }

    if (k === "ArrowLeft") keys.left = true;
    if (k === "ArrowRight") keys.right = true;
    if (k === " " && !e.repeat && (state === "ready" || state === "playing")) {
      contactThisKick = false;
      kick();
    }
  });
  window.addEventListener("keyup", (e) => {
    if (e.key === "ArrowLeft") keys.left = false;
    if (e.key === "ArrowRight") keys.right = false;
  });
  window.addEventListener("blur", () => { keys.left = keys.right = false; });

  // ---------- Update ----------
  function update(dt) {
    if (stateTimer > 0) stateTimer -= dt;

    // Duck movement (allowed while ready and playing)
    duck.moving = false;
    if (state === "ready" || state === "playing") {
      let mv = 0;
      if (keys.left) mv -= 1;
      if (keys.right) mv += 1;
      if (mv !== 0) {
        duck.x = clamp(duck.x + mv * DUCK_SPEED * dt, 30, W - 30);
        duck.dir = mv;
        duck.moving = true;
        duck.walkPhase += dt * 14;
      }
    }

    if (duck.kickT > 0) duck.kickT = Math.max(0, duck.kickT - dt);
    if (duck.cooldown > 0) duck.cooldown = Math.max(0, duck.cooldown - dt);

    if (state === "ready") {
      placeSackOnFoot();
    } else if (state === "playing") {
      sack.vy += GRAVITY * dt;
      sack.x += sack.vx * dt;
      sack.y += sack.vy * dt;
      sack.spin += sack.spinV * dt;
      // Keep inside the side walls (soft bounce)
      if (sack.x < SACK_R) { sack.x = SACK_R; sack.vx = Math.abs(sack.vx) * 0.6; }
      if (sack.x > W - SACK_R) { sack.x = W - SACK_R; sack.vx = -Math.abs(sack.vx) * 0.6; }

      // Kick contact during the active swing
      tryContact();

      if (sack.y + SACK_R >= GROUND_Y) {
        sack.y = GROUND_Y - SACK_R;
        gameOver();
      }
    } else if (state === "falling") {
      if (stateTimer <= 0) finishFall();
    }

    for (let i = popups.length - 1; i >= 0; i--) {
      const p = popups[i];
      p.t -= dt; p.y -= 50 * dt;
      if (p.t <= 0) popups.splice(i, 1);
    }
    for (let i = dust.length - 1; i >= 0; i--) {
      const d = dust[i];
      d.t -= dt; d.vy += 300 * dt; d.x += d.vx * dt; d.y = Math.min(GROUND_Y, d.y + d.vy * dt);
      if (d.t <= 0) dust.splice(i, 1);
    }
  }

  // ---------- Drawing ----------
  function drawBackground() {
    const sky = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
    sky.addColorStop(0, "#6ec6ff");
    sky.addColorStop(1, "#cdeeff");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, GROUND_Y);

    // sun
    ctx.fillStyle = "#fff3a0";
    ctx.beginPath(); ctx.arc(690, 80, 38, 0, Math.PI * 2); ctx.fill();

    // clouds
    const t = performance.now() / 1000;
    drawCloud((120 + t * 8) % (W + 200) - 100, 90, 1);
    drawCloud((480 + t * 5) % (W + 200) - 100, 150, 0.8);

    // hills
    ctx.fillStyle = "#8fd37a";
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y);
    ctx.quadraticCurveTo(200, GROUND_Y - 110, 420, GROUND_Y);
    ctx.quadraticCurveTo(620, GROUND_Y - 80, W, GROUND_Y);
    ctx.fill();

    // ground
    ctx.fillStyle = "#5bb34a";
    ctx.fillRect(0, GROUND_Y, W, 10);
    ctx.fillStyle = "#8a5a32";
    ctx.fillRect(0, GROUND_Y + 10, W, H - GROUND_Y - 10);
  }

  function drawCloud(x, y, s) {
    ctx.fillStyle = "rgba(255,255,255,0.9)";
    ctx.beginPath();
    ctx.arc(x, y, 22 * s, 0, Math.PI * 2);
    ctx.arc(x + 25 * s, y - 10 * s, 28 * s, 0, Math.PI * 2);
    ctx.arc(x + 55 * s, y, 22 * s, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawLeg(hip, angle, color) {
    const len = 30;
    const kx = hip.x + Math.sin(angle) * len * duck.dir;
    const ky = hip.y + Math.cos(angle) * len;
    ctx.strokeStyle = color;
    ctx.lineWidth = 5;
    ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(hip.x, hip.y); ctx.lineTo(kx, ky); ctx.stroke();
    // webbed foot
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(kx - 3 * duck.dir, ky - 2);
    ctx.lineTo(kx + 17 * duck.dir, ky + 1);
    ctx.lineTo(kx + 13 * duck.dir, ky + 5);
    ctx.lineTo(kx - 3 * duck.dir, ky + 4);
    ctx.closePath();
    ctx.fill();
  }

  function drawDuck() {
    const x = duck.x, d = duck.dir;
    const bob = duck.moving ? Math.abs(Math.sin(duck.walkPhase)) * 3 : 0;
    const bodyY = GROUND_Y - 58 - bob;

    // shadow
    ctx.fillStyle = "rgba(0,0,0,0.18)";
    ctx.beginPath(); ctx.ellipse(x, GROUND_Y + 3, 34, 6, 0, 0, Math.PI * 2); ctx.fill();

    // back leg (standing leg)
    const backHip = { x: x - 6 * d, y: GROUND_Y - 34 };
    const walkSwing = duck.moving ? Math.sin(duck.walkPhase) * 0.35 : 0;
    drawLeg(backHip, walkSwing, "#e8851a");

    // body
    ctx.fillStyle = "#ffd93b";
    ctx.beginPath(); ctx.ellipse(x, bodyY, 36, 26, 0, 0, Math.PI * 2); ctx.fill();
    // tail
    ctx.beginPath();
    ctx.moveTo(x - 30 * d, bodyY - 8);
    ctx.lineTo(x - 48 * d, bodyY - 22);
    ctx.lineTo(x - 36 * d, bodyY + 4);
    ctx.closePath(); ctx.fill();
    // wing
    ctx.fillStyle = "#f2c21f";
    const flap = duck.kickT > 0 ? -0.5 : (duck.moving ? Math.sin(duck.walkPhase) * 0.15 : 0);
    ctx.save();
    ctx.translate(x - 4 * d, bodyY - 2);
    ctx.rotate(flap * d);
    ctx.beginPath(); ctx.ellipse(0, 0, 20, 12, -0.2 * d, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // head
    const hx = x + 24 * d, hy = bodyY - 32;
    ctx.fillStyle = "#ffd93b";
    ctx.beginPath(); ctx.arc(hx, hy, 18, 0, Math.PI * 2); ctx.fill();
    // bill
    ctx.fillStyle = "#ff8c1a";
    ctx.beginPath();
    ctx.moveTo(hx + 12 * d, hy - 2);
    ctx.quadraticCurveTo(hx + 34 * d, hy - 2, hx + 32 * d, hy + 5);
    ctx.quadraticCurveTo(hx + 22 * d, hy + 9, hx + 12 * d, hy + 6);
    ctx.closePath(); ctx.fill();
    // eye — looks toward the sack
    const ex = hx + 6 * d, ey = hy - 6;
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(ex, ey, 5.5, 0, Math.PI * 2); ctx.fill();
    const look = Math.atan2(sack.y - ey, sack.x - ex);
    ctx.fillStyle = "#1a1a1a";
    ctx.beginPath(); ctx.arc(ex + Math.cos(look) * 2.2, ey + Math.sin(look) * 2.2, 2.6, 0, Math.PI * 2); ctx.fill();
    // headband (hacky sack style!)
    ctx.strokeStyle = "#e53935";
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(hx, hy, 17, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();

    // kicking leg (front)
    const hip = hipPos();
    const angle = duck.moving && duck.kickT <= 0 ? -walkSwing : kickProgress() * 1.15;
    drawLeg(hip, angle, "#ff9d2e");
  }

  function drawSack() {
    ctx.save();
    ctx.translate(sack.x, sack.y);
    ctx.rotate(sack.spin);
    const colors = ["#e53935", "#43a047", "#1e88e5", "#fdd835"];
    for (let i = 0; i < 4; i++) {
      ctx.fillStyle = colors[i];
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, SACK_R, (i * Math.PI) / 2, ((i + 1) * Math.PI) / 2);
      ctx.closePath();
      ctx.fill();
    }
    ctx.strokeStyle = "rgba(0,0,0,0.45)";
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(0, 0, SACK_R, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();

    // ground shadow helps judge where it lands
    if (state === "playing") {
      const h = GROUND_Y - sack.y;
      const s = clamp(1 - h / 400, 0.25, 1);
      ctx.fillStyle = `rgba(0,0,0,${0.25 * s})`;
      ctx.beginPath(); ctx.ellipse(sack.x, GROUND_Y + 3, 12 * s, 3.5 * s, 0, 0, Math.PI * 2); ctx.fill();
    }
  }

  function text(str, x, y, size, color = "#fff", align = "center", stroke = true) {
    ctx.font = `bold ${size}px "Trebuchet MS", Arial, sans-serif`;
    ctx.textAlign = align;
    ctx.textBaseline = "middle";
    if (stroke) {
      ctx.lineWidth = Math.max(3, size / 7);
      ctx.strokeStyle = "rgba(20,30,50,0.85)";
      ctx.lineJoin = "round";
      ctx.strokeText(str, x, y);
    }
    ctx.fillStyle = color;
    ctx.fillText(str, x, y);
  }

  function panel(x, y, w, h) {
    ctx.fillStyle = "rgba(20,30,50,0.82)";
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(x, y, w, h, 14) : ctx.rect(x, y, w, h);
    ctx.fill();
    ctx.strokeStyle = "#ffd93b";
    ctx.lineWidth = 3;
    ctx.stroke();
  }

  function drawHUD() {
    text(`SCORE ${score}`, 20, 30, 26, "#fff", "left");
    const best = highScores.length ? highScores[0].score : 0;
    text(`BEST ${Math.max(best, score)}`, W - 20, 30, 20, "#ffd93b", "right");

    if (state === "ready") {
      text("HACKY DUCK", W / 2, 120, 64, "#ffd93b");
      text("← → move    SPACE kick", W / 2, 185, 24);
      text("Press SPACE to kick off!", W / 2, 225, 22, "#fff");
      text("Keep the sack in the air — 100 points per kick", W / 2, 260, 18, "#e8f6ff");
    }
  }

  function drawInitials() {
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.fillRect(0, 0, W, H);
    panel(W / 2 - 230, 90, 460, 300);
    text("NEW HIGH SCORE!", W / 2, 135, 40, "#ffd93b");
    text(`${score} points`, W / 2, 180, 26);
    text("Enter your initials", W / 2, 220, 20, "#cfe3ff");
    const blink = Math.floor(performance.now() / 400) % 2 === 0;
    for (let i = 0; i < 3; i++) {
      const bx = W / 2 - 75 + i * 60;
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(bx - 20, 300, 40, 4);
      const ch = initials[i] || (i === initials.length && blink ? "_" : "");
      text(ch, bx, 272, 44, "#fff");
    }
    text("A–Z to type • BACKSPACE to fix • ENTER to save", W / 2, 345, 15, "#cfe3ff", "center", false);
  }

  function drawScores() {
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.fillRect(0, 0, W, H);
    panel(W / 2 - 200, 30, 400, 440);
    text("GAME OVER", W / 2, 66, 36, "#ff6b5b");
    text(`Your score: ${score}`, W / 2, 102, 20);
    text("TOP TEN", W / 2, 136, 24, "#ffd93b");

    for (let i = 0; i < MAX_SCORES; i++) {
      const y = 166 + i * 26;
      const e = highScores[i];
      const hl = i === lastRank;
      if (hl) {
        ctx.fillStyle = "rgba(255,217,59,0.2)";
        ctx.fillRect(W / 2 - 170, y - 12, 340, 24);
      }
      const color = hl ? "#ffd93b" : "#ffffff";
      text(`${i + 1}.`, W / 2 - 120, y, 18, color, "right", false);
      text(e ? e.initials : "---", W / 2 - 95, y, 18, color, "left", false);
      text(e ? String(e.score) : "", W / 2 + 140, y, 18, color, "right", false);
    }
    const blink = Math.floor(performance.now() / 500) % 2 === 0;
    if (blink && stateTimer <= 0) text("Press SPACE to play again", W / 2, 445, 20, "#fff");
  }

  function draw() {
    drawBackground();
    drawDuck();
    drawSack();

    for (const d of dust) {
      ctx.fillStyle = `rgba(140,100,60,${clamp(d.t * 1.5, 0, 1)})`;
      ctx.beginPath(); ctx.arc(d.x, d.y, 3, 0, Math.PI * 2); ctx.fill();
    }
    for (const p of popups) {
      ctx.globalAlpha = clamp(p.t / 0.9, 0, 1);
      text(p.text, p.x, p.y, 22, "#ffd93b");
      ctx.globalAlpha = 1;
    }

    drawHUD();
    if (state === "initials") drawInitials();
    if (state === "scores") drawScores();
  }

  // ---------- Loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  resetGame();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
